<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>No molestar por...</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --border: #d7d7d7;
    --accent: #1a73e8;
    --accent-hover: #1558b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
  }

  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    padding: 18px 20px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }

  p.sub {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 16px 0;
  }

  .fields {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .fields input[type="number"] {
    flex: 1 1 40%;
    min-width: 0;
    padding: 9px 10px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  .fields input[type="number"]:focus {
    border-color: var(--accent);
  }

  .fields select {
    flex: 1 1 60%;
    min-width: 0;
    padding: 9px 10px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    outline: none;
  }
  .fields select:focus {
    border-color: var(--accent);
  }

  .error {
    font-size: 12px;
    color: #d0342c;
    min-height: 16px;
    margin-top: 8px;
  }

  .section-title {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 18px 0 8px 0;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    user-select: none;
  }
  .toggle-row:last-of-type { border-bottom: none; }

  .toggle-row .label {
    font-size: 13px;
    color: var(--text);
  }

  .toggle-pill {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: #f5f5f5;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .toggle-pill.on {
    color: var(--accent);
    border-color: var(--accent);
    background: #e8f0fe;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  button {
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-cancel {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }
  .btn-cancel:hover { background: #f2f2f2; }

  .btn-confirm {
    background: var(--accent);
    color: #fff;
  }
  .btn-confirm:hover { background: var(--accent-hover); }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>No molestar por...</h1>
      <p class="sub">Durante ese tiempo no se mostrarán notificaciones nativas de Windows.</p>

      <div class="fields">
        <input type="number" id="value-input" min="1" step="1" value="10" autofocus>
        <select id="unit-select">
          <option value="segundos">Segundos</option>
          <option value="minutos" selected>Minutos</option>
          <option value="horas">Horas</option>
          <option value="dias">Días</option>
        </select>
      </div>

      <div class="error" id="error-line"></div>

      <div class="section-title">Durante "No Molestar"</div>
      <div class="toggle-row" data-key="notificaciones">
        <span class="label">Notificaciones</span>
        <span class="toggle-pill on" data-key="notificaciones">Mostrar</span>
      </div>
      <div class="toggle-row" data-key="correos">
        <span class="label">Correos</span>
        <span class="toggle-pill on" data-key="correos">Mostrar</span>
      </div>
      <div class="toggle-row" data-key="descargas">
        <span class="label">Descargas</span>
        <span class="toggle-pill on" data-key="descargas">Mostrar</span>
      </div>
      <div class="toggle-row" data-key="actualizaciones">
        <span class="label">Actualizaciones</span>
        <span class="toggle-pill on" data-key="actualizaciones">Mostrar</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-cancel" id="cancel-btn">Cancelar</button>
      <button class="btn-confirm" id="confirm-btn">Activar</button>
    </div>
  </div>

  <script>
    const valueInput = document.getElementById("value-input");
    const unitSelect = document.getElementById("unit-select");
    const errorLine = document.getElementById("error-line");
    const confirmBtn = document.getElementById("confirm-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const toggleRows = document.querySelectorAll(".toggle-row");

    function renderPill(key, isOn) {
      const pill = document.querySelector(`.toggle-pill[data-key="${key}"]`);
      if (!pill) return;
      pill.textContent = isOn ? "Mostrar" : "No mostrar";
      pill.classList.toggle("on", isOn);
    }

    async function loadCategorySettings() {
      const settings = await window.dndAPI.getCategorySettings();
      Object.entries(settings).forEach(([key, isOn]) => renderPill(key, isOn));
    }

    toggleRows.forEach((row) => {
      row.addEventListener("click", async () => {
        const key = row.dataset.key;
        const settings = await window.dndAPI.toggleCategory(key);
        renderPill(key, settings[key]);
      });
    });

    function submit() {
      const value = Number(valueInput.value);
      if (!Number.isFinite(value) || value <= 0) {
        errorLine.textContent = "Ingresa un número mayor a 0.";
        valueInput.focus();
        return;
      }
      errorLine.textContent = "";
      window.dndAPI.confirm(value, unitSelect.value);
    }

    confirmBtn.addEventListener("click", submit);
    cancelBtn.addEventListener("click", () => window.dndAPI.cancel());

    valueInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });

    valueInput.focus();
    valueInput.select();
    loadCategorySettings();
  </script>
</body>
</html>
