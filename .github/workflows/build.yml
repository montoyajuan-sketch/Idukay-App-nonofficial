name: Build Windows App

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder necesita permiso de escritura para crear/actualizar Releases
# y subir los instaladores como assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      # El tag es la fuente de verdad para las releases.
      # Ejemplo: v0.6.8 -> version 0.6.8
      # Se modifica package.json solo dentro del runner; no se hace commit.
      - name: Sincronizar versión con el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm version $version --no-git-tag-version

      - name: Compilar (build normal, sin publicar release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never

      - name: Compilar y publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir el instalador como artefacto descargable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: idukay-app-windows
          path: dist/*.exe
