name: Build Windows App

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar versión con el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $currentVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($currentVersion -ne $version) {
            npm version $version --no-git-tag-version
          } else {
            Write-Host "La versión ya es $version; no es necesario cambiar package.json."
          }

      # Build normal para probar desde main.
      - name: Compilar build normal
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never

      # En releases generamos los 3 formatos:
      # 1. NSIS Setup (.exe)
      # 2. Portable (.exe)
      # 3. Unpacked (ZIP)
      - name: Compilar Setup, Portable y Unpacked
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          npx electron-builder --win nsis portable dir --publish never
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/IdukayApp-${{ github.ref_name }}-unpacked.zip" -Force

      - name: Publicar archivos en GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IdukayApp ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir el instalador como artefacto descargable
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: idukay-app-windows
          path: dist/*.exe
